# Publishes this package to npm. Manual only: an npm version cannot be taken
# back. It builds and tests first, and attaches npm provenance, which a public
# repository can.
#
# Needs one secret, NPM_TOKEN: a granular token of the valnivo_labs account
# with publish rights on @valnivo_labs/verify.
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only show what would be published'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public --provenance
          fi
