# Builds and tests on every push and pull request.
name: Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The offline checker is what its source builds
        run: |
          npm run build:checker
          cmp checker/dist/valnivo-checker.html checker/valnivo-checker.html
